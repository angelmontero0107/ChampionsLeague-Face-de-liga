name: Actualizar resultados

on:
  schedule:
    - cron: '*/15 17-23 * * 2-4'   # martes a jueves, tarde-noche UTC (partidos)
    - cron: '*/15 0-2 * * 3-5'     # madrugada UTC, por si hay retraso
  workflow_dispatch:                # botón manual en la pestaña Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-results.js
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
