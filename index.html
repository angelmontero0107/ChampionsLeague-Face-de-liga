<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predictor Champions 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#0A0F1E;
    --bg-panel:#121A33;
    --bg-panel-alt:#182242;
    --accent:#3D6BFF;
    --accent-soft:#3D6BFF22;
    --gold:#E7B740;
    --text:#F3F5FA;
    --text-muted:#8C93AF;
    --success:#34C77B;
    --success-soft:#34C77B22;
    --danger:#F0553D;
    --border:rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #101a38 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  h1,h2,h3,.headline{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .tabular{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  /* ---------- layout shells ---------- */
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 80px;}
  header.hero{
    padding:38px 18px 26px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, #0D1430 0%, transparent 100%);
  }
  .hero-inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:6px;}
  .eyebrow-row{display:flex;align-items:center;gap:10px;}
  .ball{
    width:30px;height:30px;border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), var(--gold), var(--accent));
    position:relative;flex-shrink:0;
    box-shadow:0 0 18px var(--accent-soft);
  }
  .ball:before{
    content:'';position:absolute;inset:5px;border-radius:50%;
    background:var(--bg);
  }
  h1.title{font-size:26px;text-transform:uppercase;color:var(--text);}
  .subtitle{color:var(--text-muted);font-size:14.5px;line-height:1.5;max-width:520px;}

  .player-bar{
    margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .player-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-panel);border:1px solid var(--border);
    padding:8px 14px;border-radius:100px;font-size:14px;
  }
  .player-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
  .ghost-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    padding:8px 14px;border-radius:100px;font-size:13px;transition:border-color .15s, color .15s;
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--text);}

  /* ---------- nav tabs ---------- */
  nav.main-tabs{
    display:flex;gap:4px;margin:22px 0 18px;
    border-bottom:1px solid var(--border);
  }
  nav.main-tabs button{
    background:transparent;border:none;color:var(--text-muted);
    font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.02em;
    padding:10px 4px;margin-right:22px;border-bottom:2px solid transparent;
    text-transform:uppercase;
  }
  nav.main-tabs button.active{color:var(--text);border-color:var(--accent);}

  /* ---------- matchday pills ---------- */
  .md-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:thin;}
  .md-pill{
    flex-shrink:0;background:var(--bg-panel);border:1px solid var(--border);
    color:var(--text-muted);padding:9px 16px;border-radius:10px;font-size:13.5px;
    font-family:'Oswald',sans-serif;letter-spacing:.02em;white-space:nowrap;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:all .15s;
  }
  .md-pill .sub{font-family:'Inter',sans-serif;font-size:10px;color:var(--text-muted);opacity:.8;}
  .md-pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text);}
  .md-pill.done .sub{color:var(--success);}

  /* ---------- match cards ---------- */
  .day-group{margin-bottom:22px;}
  .day-label{
    font-size:12.5px;color:var(--text-muted);text-transform:capitalize;
    margin:0 0 10px 2px;
  }
  .match-card{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;margin-bottom:9px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .match-card.locked{opacity:.72;}
  .teams{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .team-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .team-name{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .team-name.winner{color:var(--gold);font-weight:600;}
  .score-wrap{display:flex;align-items:center;gap:5px;}
  .score-input{
    width:34px;height:34px;text-align:center;border-radius:8px;
    background:var(--bg-panel-alt);border:1px solid var(--border);color:var(--text);
    font-size:15px;font-weight:600;
  }
  .score-input:disabled{opacity:.55;}
  .score-input:focus{outline:none;border-color:var(--accent);}
  .real-score{
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;background:var(--success-soft);color:var(--success);
    font-weight:700;font-size:15px;
  }
  .meta-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:92px;}
  .kickoff{font-size:11px;color:var(--text-muted);text-align:right;}
  .status-badge{
    font-size:10.5px;padding:3px 9px;border-radius:100px;font-weight:600;
    letter-spacing:.02em;white-space:nowrap;
  }
  .status-open{background:var(--accent-soft);color:#9DB4FF;}
  .status-locked{background:rgba(255,255,255,0.07);color:var(--text-muted);}
  .status-final{background:var(--success-soft);color:var(--success);}
  .points-pill{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;
  }
  .points-3{background:var(--gold);color:#241a02;}
  .points-1{background:var(--success-soft);color:var(--success);}
  .points-0{background:rgba(255,255,255,0.06);color:var(--text-muted);}

  .result-entry{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);
  }
  .result-entry input{width:30px;height:26px;text-align:center;border-radius:6px;
    background:var(--bg-panel-alt);border:1px solid var(--border);color:var(--text);font-size:13px;}
  .result-entry button{
    background:var(--accent);color:#fff;border:none;padding:5px 11px;border-radius:7px;font-size:11.5px;font-weight:600;
  }

  /* ---------- leaderboard ---------- */
  .board-row{
    display:flex;align-items:center;gap:14px;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:8px;
  }
  .board-row.me{border-color:var(--accent);}
  .rank{font-family:'Oswald',sans-serif;font-size:18px;color:var(--text-muted);width:22px;}
  .rank.top{color:var(--gold);}
  .board-name{flex:1;font-weight:600;font-size:15px;}
  .board-pts{font-family:'Oswald',sans-serif;font-size:18px;color:var(--text);}
  .board-pts .lbl{font-family:'Inter',sans-serif;font-size:11px;color:var(--text-muted);margin-left:3px;}
  .empty-note{color:var(--text-muted);font-size:13.5px;text-align:center;padding:30px 10px;}

  .rules-box{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:18px;font-size:13px;color:var(--text-muted);line-height:1.6;
  }
  .rules-box b{color:var(--text);}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,9,20,.78);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-box{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;
    padding:26px 24px;max-width:360px;width:100%;
  }
  .modal-box h2{font-size:19px;text-transform:uppercase;margin-bottom:6px;}
  .modal-box p{color:var(--text-muted);font-size:13px;margin:0 0 16px;line-height:1.5;}
  .modal-form-col{display:flex;flex-direction:column;gap:10px;}
  .modal-form-col input{
    background:var(--bg-panel-alt);border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:9px;font-size:14.5px;
  }
  .modal-form-col input:focus{outline:none;border-color:var(--accent);}
  .primary-btn{
    background:var(--accent);color:#fff;border:none;padding:11px 16px;border-radius:9px;
    font-size:14px;font-weight:600;
  }
  .primary-btn:disabled{opacity:0.6;cursor:not-allowed;}
  .modal-error{color:var(--danger);font-size:12.5px;line-height:1.4;margin:1px 0 2px;min-height:16px;}


  .refresh-row{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .refresh-row button{background:none;border:none;color:var(--text-muted);font-size:12px;}
  .refresh-row button:hover{color:var(--accent);}

  @media (max-width:480px){
    .meta-col{min-width:70px;}
    .team-name{font-size:13.5px;}
    h1.title{font-size:21px;}
  }
</style>
</head>

const MATCHES = RAW_MATCHES.map((m,i)=>({
  id:"m"+(i+1),
  md:m[0], date:m[1], time:m[2], home:m[3], away:m[4],
  officialResult: (m[5]===null? null : {h:m[5], a:m[6]})
}));

const MATCHDAYS = [1,2,3,4,5,6,7,8];

/* ============ STATE ============ */
let currentPlayer = null;
let players = [];
let myPredictions = {};       // matchId -> {h,a}
let liveResults = {};         // matchId -> {h,a}  (official result, may already be baked into MATCHES for md1)
let activeMainTab = 'predict';
let activeMD = 1;
let leaderboardCache = [];

/* ============ HELPERS ============ */
function kickoffDate(m){ return new Date(m.date+"T"+m.time+":00+01:00"); }
function isLocked(m){ return Date.now() >= kickoffDate(m).getTime(); }
function getResult(m){
  if(m.officialResult) return m.officialResult;
  if(liveResults[m.id]) return liveResults[m.id];
  return null;
}
function pointsFor(pred, result){
  if(!pred || !result) return null;
  if(pred.h===result.h && pred.a===result.a) return 3;
  const predOutcome = pred.h>pred.a?'H':(pred.h<pred.a?'A':'D');
  const resOutcome = result.h>result.a?'H':(result.h<result.a?'A':'D');
  return predOutcome===resOutcome ? 1 : 0;
}
function fmtDate(d){
  const dt = new Date(d+"T12:00:00");
  return dt.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ STORAGE (FIREBASE REALTIME DATABASE) ============ */
function getFirebaseKey(key){
  if(key.startsWith('predictions:')){
    const player = key.slice('predictions:'.length);
    const safePlayer = encodeURIComponent(player).replace(/\./g, '%2E');
    return 'predictions/' + safePlayer;
  }
  return key.replace(/[\.\#\$\[\]\/]/g, '_');
}

async function safeGet(key, shared){
  if(!shared){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  if(!db){
    try{ return localStorage.getItem('fb_fallback_' + key); }catch(e){ return null; }
  }
  try{
    const path = getFirebaseKey(key);
    const snap = await db.ref(path).get();
    if(!snap.exists()){
      return localStorage.getItem('fb_fallback_' + key) || null;
    }
    const val = snap.val();
    return typeof val === 'string' ? val : JSON.stringify(val);
  }catch(e){
    console.warn('safeGet error for ' + key, e);
    try{ return localStorage.getItem('fb_fallback_' + key); }catch(err){ return null; }
  }
}

async function safeSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem(key, value); }catch(e){}
    return;
  }
  try{ localStorage.setItem('fb_fallback_' + key, value); }catch(e){}
  if(!db) return;
  try{
    const path = getFirebaseKey(key);
    let data;
    try { data = JSON.parse(value); } catch(err) { data = value; }
    await db.ref(path).set(data);
  }catch(e){
    console.error('safeSet error for ' + key, e);
  }
}

async function loadPlayers(){
  const raw = await safeGet('players', true);
  let parsed = [];
  if(raw){
    try{
      const p = JSON.parse(raw);
      parsed = Array.isArray(p) ? p : Object.values(p);
    }catch(e){
      parsed = [];
    }
  }
  players = Array.from(new Set(parsed.filter(p => typeof p === 'string' && p.trim().length > 0)));
}

async function registerPlayer(name){
  if(!name || !name.trim()) return;
  name = name.trim();
  await loadPlayers();
  if(!players.includes(name)){
    players.push(name);
    await safeSet('players', JSON.stringify(players), true);
  }
}

async function loadMyPredictions(){
  if(!currentPlayer) return;
  const raw = await safeGet('predictions:'+currentPlayer, true);
  try{ myPredictions = raw ? JSON.parse(raw) : {}; }catch(e){ myPredictions = {}; }
}

async function saveMyPrediction(matchId, h, a){
  if(!currentPlayer) return;
  myPredictions[matchId] = {h,a};
  await safeSet('predictions:'+currentPlayer, JSON.stringify(myPredictions), true);
}

async function loadLiveResults(){
  const raw = await safeGet('results', true);
  try{ liveResults = raw ? JSON.parse(raw) : {}; }catch(e){ liveResults = {}; }
}

async function submitResult(matchId, h, a){
  liveResults[matchId] = {h,a};
  await safeSet('results', JSON.stringify(liveResults), true);
}

async function loadPredictionsFor(name){
  const raw = await safeGet('predictions:'+name, true);
  try{ return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}

/* ============ PIN HELPERS ============ */
async function getPlayerPin(name){
  if(!db) return localStorage.getItem('pin_' + name);
  try{
    const safeName = encodeURIComponent(name).replace(/\./g, '%2E');
    const snap = await db.ref('pins/' + safeName).get();
    return snap.exists() ? String(snap.val()) : null;
  }catch(e){
    return localStorage.getItem('pin_' + name);
  }
}

async function setPlayerPin(name, pin){
  try{ localStorage.setItem('pin_' + name, pin); }catch(e){}
  if(!db) return;
  try{
    const safeName = encodeURIComponent(name).replace(/\./g, '%2E');
    await db.ref('pins/' + safeName).set(String(pin));
  }catch(e){
    console.error('Error saving pin', e);
  }
}

/* ============ MODAL: login / register ============ */
async function showPlayerModal(prefillName){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-box">
        <h2>Entrar a jugar</h2>
        <p>Ingresa tu nombre y tu PIN de 4 números. Si es tu primera vez, tu usuario se creará automáticamente con ese PIN.</p>

        <div class="modal-form-col">
          <input id="player-name-input" type="text" placeholder="Tu nombre o apodo" maxlength="20" value="${escapeHtml(prefillName || '')}">
          <input id="player-pin-input" type="password" placeholder="PIN de 4 dígitos" maxlength="4" inputmode="numeric" pattern="[0-9]*">
          <div id="modal-error" class="modal-error"></div>
          <button class="primary-btn" id="modal-submit-btn" style="width:100%;">Entrar</button>
          ${currentPlayer ? `<button class="ghost-btn" id="modal-cancel-btn" style="width:100%;margin-top:2px;">Cancelar</button>` : ''}
        </div>
      </div>
    </div>`;

  const nameInput = document.getElementById('player-name-input');
  const pinInput = document.getElementById('player-pin-input');
  const errorEl = document.getElementById('modal-error');
  const submitBtn = document.getElementById('modal-submit-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');

  if(cancelBtn){
    cancelBtn.addEventListener('click', () => {
      root.innerHTML = '';
    });
  }

  const handleAuth = async () => {
    const nameVal = nameInput.value.trim();
    const pinVal = pinInput.value.trim();

    if(!nameVal){
      errorEl.textContent = 'Por favor escribe tu nombre.';
      nameInput.focus();
      return;
    }
    if(nameVal.length < 2){
      errorEl.textContent = 'El nombre debe tener al menos 2 caracteres.';
      nameInput.focus();
      return;
    }
    if(!/^\d{4}$/.test(pinVal)){
      errorEl.textContent = 'El PIN debe contener exactamente 4 números.';
      pinInput.focus();
      return;
    }

    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    await loadPlayers();
    const existing = players.find(p => p.toLowerCase() === nameVal.toLowerCase());

    if(existing){
      const actualPin = await getPlayerPin(existing);
      if(actualPin && actualPin !== pinVal){
        errorEl.textContent = 'PIN incorrecto para este usuario.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        pinInput.value = '';
        pinInput.focus();
        return;
      }
      if(!actualPin){
        await setPlayerPin(existing, pinVal);
      }
      await selectPlayer(existing, pinVal);
    } else {
      await setPlayerPin(nameVal, pinVal);
      await registerPlayer(nameVal);
      await selectPlayer(nameVal, pinVal);
    }
  };

  submitBtn.addEventListener('click', handleAuth);
  pinInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleAuth(); });
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') pinInput.focus(); });

  setTimeout(() => {
    if(prefillName && pinInput) pinInput.focus();
    else if(nameInput) nameInput.focus();
  }, 80);
}

async function selectPlayer(name, pin){
  currentPlayer = name;
  await safeSet('my-player-name', name, false);
  if(pin){
    try{ localStorage.setItem('my-player-pin', pin); }catch(e){}
  }
  document.getElementById('modal-root').innerHTML = '';
  await loadMyPredictions();
  renderPlayerBar();
  renderAll();
}

/* ============ RENDER: player bar ============ */
function renderPlayerBar(){
  const bar = document.getElementById('player-bar');
  bar.innerHTML = `
    <div class="player-chip"><span class="dot"></span>Jugando como <b style="margin-left:3px">${escapeHtml(currentPlayer)}</b></div>
    <button class="ghost-btn" id="switch-player-btn">Cambiar jugador</button>
  `;
  document.getElementById('switch-player-btn').addEventListener('click', showPlayerModal);
}

/* ============ RENDER: predictions view ============ */
function renderPredictView(){
  const view = document.getElementById('predict-view');
  const mdMatches = MATCHES.filter(m=>m.md===activeMD);
  const finishedCount = mdMatches.filter(m=>getResult(m)).length;

  const pillsHtml = MATCHDAYS.map(md=>{
    const matches = MATCHES.filter(m=>m.md===md);
    const done = matches.every(m=>getResult(m));
    const allLocked = matches.every(isLocked);
    return `<button class="md-pill ${md===activeMD?'active':''} ${done?'done':''}" data-md="${md}">
      J${md}<span class="sub">${done? 'finalizada' : (allLocked? 'en juego' : 'abierta')}</span>
    </button>`;
  }).join('');

  const byDate = {};
  mdMatches.forEach(m=>{ (byDate[m.date] = byDate[m.date]||[]).push(m); });

  let daysHtml = '';
  Object.keys(byDate).sort().forEach(date=>{
    daysHtml += `<div class="day-group"><div class="day-label">${fmtDate(date)}</div>`;
    byDate[date].forEach(m=>{ daysHtml += renderMatchCard(m); });
    daysHtml += `</div>`;
  });

  view.innerHTML = `
    <div class="rules-box"><b>Reglas:</b> 3 puntos por marcador exacto &middot; 1 punto por acertar solo el resultado (victoria local, empate o victoria visitante) &middot; 0 puntos si fallas. Los pronósticos se bloquean automáticamente en el horario de inicio de cada partido.</div>
    <div class="md-scroll">${pillsHtml}</div>
    ${daysHtml}
  `;

  view.querySelectorAll('.md-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeMD = parseInt(btn.dataset.md); renderPredictView(); });
  });
  view.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('change', onScoreChange);
  });
  view.querySelectorAll('.submit-result-btn').forEach(btn=>{
    btn.addEventListener('click', onSubmitResult);
  });
}

function renderMatchCard(m){
  const locked = isLocked(m);
  const result = getResult(m);
  const pred = myPredictions[m.id];
  const pts = result ? pointsFor(pred, result) : null;

  let statusBadge, pointsBadge = '';
  if(result){
    statusBadge = `<span class="status-badge status-final">Finalizado</span>`;
    if(pts!==null){
      const cls = pts===3?'points-3':(pts===1?'points-1':'points-0');
      pointsBadge = `<span class="points-pill ${cls}">${pts===3?'+3 exacto':(pts===1?'+1 acierto':'0 pts')}</span>`;
    }
  } else if(locked){
    statusBadge = `<span class="status-badge status-locked">Cerrada</span>`;
  } else {
    statusBadge = `<span class="status-badge status-open">Abierta</span>`;
  }

  const homeWinner = result && result.h > result.a;
  const awayWinner = result && result.a > result.h;

  const leftScoreHtml = result
    ? `<div class="real-score">${result.h}</div>`
    : `<input class="score-input" type="number" min="0" max="20" data-match="${m.id}" data-side="h" value="${pred? pred.h : ''}" ${locked?'disabled':''}>`;
  const rightScoreHtml = result
    ? `<div class="real-score">${result.a}</div>`
    : `<input class="score-input" type="number" min="0" max="20" data-match="${m.id}" data-side="a" value="${pred? pred.a : ''}" ${locked?'disabled':''}>`;

  let predRecap = '';
  if(result && pred){
    predRecap = `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Tu pronóstico: ${pred.h}-${pred.a}</div>`;
  }

  let resultEntry = '';
  if(!result && locked){
    resultEntry = `
      <div class="result-entry">
        <span>Poner resultado final:</span>
        <input type="number" min="0" max="20" data-match="${m.id}" data-side="rh" placeholder="0">
        <span>-</span>
        <input type="number" min="0" max="20" data-match="${m.id}" data-side="ra" placeholder="0">
        <button class="submit-result-btn" data-match="${m.id}">Guardar</button>
      </div>`;
  }

  return `
    <div class="match-card ${locked?'locked':''}">
      <div class="teams">
        <div class="team-row">
          <span class="team-name ${homeWinner?'winner':''}">${escapeHtml(m.home)}</span>
          ${leftScoreHtml}
        </div>
        <div class="team-row">
          <span class="team-name ${awayWinner?'winner':''}">${escapeHtml(m.away)}</span>
          ${rightScoreHtml}
        </div>
        ${predRecap}
        ${resultEntry}
      </div>
      <div class="meta-col">
        <span class="kickoff">${m.time}${m.md===8?' (aprox.)':''}</span>
        ${statusBadge}
        ${pointsBadge}
      </div>
    </div>
  `;
}

async function onScoreChange(e){
  const matchId = e.target.dataset.match;
  const side = e.target.dataset.side;
  const val = e.target.value === '' ? null : parseInt(e.target.value);
  if(val===null || isNaN(val) || val<0) return;
  const existing = myPredictions[matchId] || {h:0,a:0};
  if(side==='h') existing.h = val; else existing.a = val;
  await saveMyPrediction(matchId, existing.h, existing.a);
}

async function onSubmitResult(e){
  const matchId = e.target.dataset.match;
  const card = e.target.closest('.match-card');
  const hInput = card.querySelector('[data-side="rh"]');
  const aInput = card.querySelector('[data-side="ra"]');
  const h = parseInt(hInput.value), a = parseInt(aInput.value);
  if(isNaN(h) || isNaN(a) || h<0 || a<0) return;
  await submitResult(matchId, h, a);
  renderPredictView();
}

/* ============ RENDER: leaderboard ============ */
async function computeLeaderboard(){
  await loadPlayers();
  await loadLiveResults();
  
  let allPreds = {};
  if(db){
    try{
      const snap = await db.ref('predictions').get();
      if(snap.exists()){
        allPreds = snap.val() || {};
      }
    }catch(err){
      console.warn('Leaderboard batch fetch error', err);
    }
  }

  const table = [];
  for(const name of players){
    const safeKey = encodeURIComponent(name).replace(/\./g, '%2E');
    let preds = allPreds[safeKey] || allPreds[name];
    if(!preds){
      preds = await loadPredictionsFor(name);
    }
    let total = 0, exactCount = 0, hitCount = 0, playedCount = 0;
    MATCHES.forEach(m=>{
      const result = getResult(m);
      if(!result) return;
      const p = preds[m.id];
      if(!p) return;
      playedCount++;
      const pts = pointsFor(p, result);
      if(pts===3) exactCount++;
      else if(pts===1) hitCount++;
      total += (pts||0);
    });
    table.push({name, total, exactCount, hitCount, playedCount});
  }
  table.sort((a,b)=> b.total - a.total);
  return table;
}

async function renderBoardView(){
  const view = document.getElementById('board-view');
  view.innerHTML = `<div class="empty-note">Calculando clasificación…</div>`;
  const table = await computeLeaderboard();
  leaderboardCache = table;
  if(table.length===0){
    view.innerHTML = `<div class="empty-note">Todavía no hay jugadores registrados.</div>`;
    return;
  }
  view.innerHTML = table.map((row,i)=>{
    const isMe = row.name===currentPlayer;
    const rankCls = i<3 ? 'rank top' : 'rank';
    return `
      <div class="board-row ${isMe?'me':''}">
        <div class="${rankCls}">${i+1}</div>
        <div class="board-name">${escapeHtml(row.name)}${isMe?' (tú)':''}<div style="font-size:11px;color:var(--text-muted);font-weight:400;">${row.exactCount} exactos &middot; ${row.hitCount} aciertos &middot; ${row.playedCount} jugados</div></div>
        <div class="board-pts">${row.total}<span class="lbl">pts</span></div>
      </div>
    `;
  }).join('');
}

/* ============ MAIN TABS ============ */
function setupMainTabs(){
  const nav = document.getElementById('main-tabs');
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeMainTab = btn.dataset.tab;
      document.getElementById('predict-view').style.display = activeMainTab==='predict' ? 'block':'none';
      document.getElementById('board-view').style.display = activeMainTab==='board' ? 'block':'none';
      if(activeMainTab==='board') await renderBoardView();
    });
  });
}

function renderAll(){
  renderPredictView();
  if(activeMainTab==='board') renderBoardView();
}

/* ============ REALTIME SYNC ============ */
function setupRealtimeSync(){
  if(!db) return;
  db.ref('results').on('value', snap => {
    if(snap.exists()){
      liveResults = snap.val() || {};
      if(activeMainTab==='predict') renderPredictView();
      else renderBoardView();
    }
  });
  db.ref('players').on('value', snap => {
    if(snap.exists()){
      const val = snap.val();
      const parsed = Array.isArray(val) ? val : Object.values(val);
      players = Array.from(new Set(parsed.filter(p => typeof p === 'string' && p.trim().length > 0)));
      if(activeMainTab==='board') renderBoardView();
    }
  });
}

/* ============ INIT ============ */
async function init(){
  setupMainTabs();
  setupRealtimeSync();

  document.getElementById('refresh-btn').addEventListener('click', async ()=>{
    await loadLiveResults();
    await loadMyPredictions();
    renderAll();
  });

  const savedName = await safeGet('my-player-name', false);
  const savedPin = localStorage.getItem('my-player-pin');
  await loadLiveResults();

  if(savedName){
    const actualPin = await getPlayerPin(savedName);
    if(!actualPin || actualPin === savedPin){
      currentPlayer = savedName;
      await registerPlayer(savedName);
      await loadMyPredictions();
      renderPlayerBar();
      renderAll();
    } else {
      await showPlayerModal(savedName);
    }
  } else {
    await showPlayerModal();
  }

  // Auto-refresh secundario cada 20s
  setInterval(async ()=>{
    await loadLiveResults();
    if(activeMainTab==='predict') renderPredictView();
    else await renderBoardView();
  }, 20000);
}

init();
</script>
